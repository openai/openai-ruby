<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruby Realtime conversation</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #24324a, #111827 55%);
      }
      main {
        width: min(42rem, calc(100vw - 2rem));
        padding: 2rem;
        box-sizing: border-box;
        border: 1px solid #374151;
        border-radius: 1.25rem;
        background: rgb(17 24 39 / 88%);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
      p { color: #cbd5e1; line-height: 1.55; }
      .controls { display: flex; gap: 0.75rem; margin: 1.5rem 0; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.1rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #start { background: #22c55e; color: #052e16; }
      #stop { background: #e5e7eb; color: #111827; }
      button:disabled { cursor: wait; opacity: 0.5; }
      #status {
        min-height: 1.5rem;
        color: #93c5fd;
        font-weight: 650;
      }
      #media {
        color: #94a3b8;
        font-size: 0.875rem;
      }
      #transcript {
        min-height: 9rem;
        max-height: 20rem;
        overflow-y: auto;
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 0.75rem;
        background: #030712;
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .assistant { margin-bottom: 0.75rem; }
      .assistant::before { content: "Assistant: "; color: #86efac; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Realtime conversation</h1>
      <p>
        Talk naturally and speak over the model whenever you want to interrupt.
        The browser handles the microphone, playback, and acoustic echo cancellation.
      </p>
      <div class="controls">
        <button id="start" type="button">Start conversation</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
      <div id="status" role="status" aria-live="polite">Ready</div>
      <div id="media"></div>
      <div id="transcript" aria-live="polite" aria-label="Assistant transcript"></div>
      <audio id="remote-audio" autoplay></audio>
    </main>

    <script>
      const startButton = document.querySelector("#start");
      const stopButton = document.querySelector("#stop");
      const statusElement = document.querySelector("#status");
      const mediaElement = document.querySelector("#media");
      const transcriptElement = document.querySelector("#transcript");
      const remoteAudio = document.querySelector("#remote-audio");

      let peerConnection;
      let dataChannel;
      let microphoneStream;
      let transcriptLine;
      let startupController;
      let startupGeneration = 0;

      function setStatus(message) {
        statusElement.textContent = message;
      }

      function appendTranscript(delta) {
        if (!transcriptLine) {
          transcriptLine = document.createElement("div");
          transcriptLine.className = "assistant";
          transcriptElement.append(transcriptLine);
        }
        transcriptLine.append(document.createTextNode(delta));
        transcriptElement.scrollTop = transcriptElement.scrollHeight;
      }

      function handleEvent(message) {
        try {
          const event = JSON.parse(message.data);
          switch (event.type) {
            case "input_audio_buffer.speech_started":
              setStatus("Listening — interrupting the model…");
              break;
            case "input_audio_buffer.speech_stopped":
              setStatus("Thinking…");
              break;
            case "response.output_audio_transcript.delta":
              appendTranscript(event.delta);
              break;
            case "response.output_audio_transcript.done":
              transcriptLine = undefined;
              setStatus("Listening…");
              break;
            case "error":
              setStatus(event.error?.message || "Realtime API error");
          }
        } catch (error) {
          setStatus(`Invalid Realtime event: ${error.message}`);
        }
      }

      async function startConversation() {
        const generation = ++startupGeneration;
        const controller = new AbortController();
        startupController = controller;
        startButton.disabled = true;
        transcriptElement.replaceChildren();
        setStatus("Requesting microphone access…");

        try {
          const connection = new RTCPeerConnection();
          peerConnection = connection;
          connection.addEventListener("track", (event) => {
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play().catch(() => setStatus("Click the page to enable audio playback."));
          });
          connection.addEventListener("connectionstatechange", () => {
            if (generation !== startupGeneration) return;

            const state = connection.connectionState;
            if (state === "connected") setStatus("Listening…");
            if (state === "disconnected") setStatus("Connection interrupted; reconnecting…");
            if (state === "failed") void stopConversation({status: "Connection failed"});
          });

          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          if (generation !== startupGeneration) {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }
          microphoneStream = stream;
          stopButton.disabled = false;
          const microphone = stream.getAudioTracks()[0];
          const settings = microphone.getSettings();
          mediaElement.textContent = [
            `Microphone: ${microphone.label || "active"}`,
            `echo cancellation ${settings.echoCancellation === false ? "unavailable" : "requested"}`,
            `noise suppression ${settings.noiseSuppression === false ? "unavailable" : "requested"}`
          ].join(" · ");
          connection.addTrack(microphone, stream);

          const channel = connection.createDataChannel("oai-events");
          dataChannel = channel;
          channel.addEventListener("message", handleEvent);
          channel.addEventListener("open", () => setStatus("Listening…"));

          await connection.setLocalDescription(await connection.createOffer());
          const tokenResponse = await fetch("/token", {
            method: "POST",
            signal: controller.signal
          });
          if (!tokenResponse.ok) throw new Error(await tokenResponse.text());
          const token = await tokenResponse.json();
          if (!token.value) throw new Error("Realtime client secret was missing");

          const response = await fetch("https://api.openai.com/v1/realtime/calls", {
            method: "POST",
            signal: controller.signal,
            headers: {
              "Authorization": `Bearer ${token.value}`,
              "Content-Type": "application/sdp"
            },
            body: connection.localDescription.sdp
          });
          if (!response.ok) throw new Error(await response.text());

          if (generation !== startupGeneration) return;
          await connection.setRemoteDescription({type: "answer", sdp: await response.text()});
        } catch (error) {
          if (generation !== startupGeneration || error.name === "AbortError") return;

          stopConversation();
          setStatus(error.message.trim() || "Unable to start the conversation");
        } finally {
          if (generation === startupGeneration) startupController = undefined;
        }
      }

      function stopConversation({status = "Stopped"} = {}) {
        startupGeneration += 1;
        startupController?.abort();
        startupController = undefined;
        dataChannel?.close();
        peerConnection?.close();
        microphoneStream?.getTracks().forEach((track) => track.stop());
        remoteAudio.srcObject = null;
        dataChannel = undefined;
        peerConnection = undefined;
        microphoneStream = undefined;
        transcriptLine = undefined;
        startButton.disabled = false;
        stopButton.disabled = true;
        mediaElement.textContent = "";
        setStatus(status);
      }

      startButton.addEventListener("click", startConversation);
      stopButton.addEventListener("click", () => stopConversation());
      window.addEventListener("pagehide", () => {
        stopConversation();
      });
    </script>
  </body>
</html>
