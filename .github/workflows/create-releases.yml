name: Create releases
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_publish:
        description: "Retry publishing the current gem version to RubyGems without creating a new GitHub release."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    name: release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'openai/openai-ruby' &&
      github.event.inputs.retry_publish != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish
    needs: release
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'openai/openai-ruby' &&
      (needs.release.outputs.releases_created == 'true' ||
        github.event.inputs.retry_publish == 'true')
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Avoid persisting the default GITHUB_TOKEN; the RubyGems release action
          # configures the credentials it needs only when publishing.
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: false
          ruby-version: '4.0'

      - run: bundle install

      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@6317d8d1f7e28c24d28f6eff169ea854948bd9f7 # v1.2.0
