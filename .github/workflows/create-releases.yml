name: Create releases
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_publish:
        description: "Retry publishing the current gem version to RubyGems without creating a new GitHub release."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    name: release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'openai/openai-ruby' &&
      github.event.inputs.retry_publish != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OPENAI_SDKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENAI_SDKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: publish
    needs: release
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'openai/openai-ruby' &&
      (needs.release.outputs.releases_created == 'true' ||
        github.event.inputs.retry_publish == 'true')
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read # Check out the release and fetch tags.
      id-token: write # Exchange GitHub OIDC credentials with RubyGems.org.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Avoid persisting the default GITHUB_TOKEN; the RubyGems release action
          # configures the credentials it needs only when publishing.
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: false
          ruby-version: '4.0'

      - run: bundle install

      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
